<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">mcrepo coordinated workflow — remote repositories</title>
  <desc id="desc">Cycle: work and commit, pull to integrate work from other devices, push to publish. On conflict, paste the printed prompt to a coding agent, fix and stage the files, then re-run mcrepo pull. Named locations extend pull and push beyond origin.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1221"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="1400" height="430" rx="18" fill="url(#bg)"/>

  <text x="70" y="58" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#e2e8f0">Coordinated workflow — remote repositories</text>
  <text x="70" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#94a3b8">work from any device against origin — pull puts your local commits on top of what other devices pushed</text>

  <!-- 1 WORK + COMMIT -->
  <g filter="url(#shadow)">
    <rect x="120" y="120" width="260" height="106" rx="14" fill="url(#card)" stroke="#f97316" stroke-width="2"/>
  </g>
  <text x="138" y="148" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#fb923c">1 · WORK + COMMIT</text>
  <text x="138" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#e2e8f0">mcrepo commit -m ".."</text>
  <text x="138" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">coordinated checkpoints</text>
  <text x="138" y="216" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">(#N @batch) — repeat freely</text>

  <!-- 2 PULL -->
  <g filter="url(#shadow)">
    <rect x="570" y="120" width="260" height="106" rx="14" fill="url(#card)" stroke="#06b6d4" stroke-width="2"/>
  </g>
  <text x="588" y="148" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#22d3ee">2 · PULL (integrate)</text>
  <text x="588" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#e2e8f0">mcrepo pull</text>
  <text x="588" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">auto-stash + rebase your commits</text>
  <text x="588" y="216" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">on top of the remote work</text>

  <!-- 3 PUSH -->
  <g filter="url(#shadow)">
    <rect x="1020" y="120" width="260" height="106" rx="14" fill="url(#card)" stroke="#a78bfa" stroke-width="2"/>
  </g>
  <text x="1038" y="148" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#c4b5fd">3 · PUSH (publish)</text>
  <text x="1038" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#e2e8f0">mcrepo push</text>
  <text x="1038" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">plain push after pull — safe</text>
  <text x="1038" y="216" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">force-with-lease only when proven</text>

  <!-- arrows: commit -> pull -> push, and cycle back -->
  <line x1="380" y1="173" x2="565" y2="173" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="830" y1="173" x2="1015" y2="173" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 1250 120 C 1250 100, 1230 96, 1200 96 L 320 96 C 290 96, 270 100, 270 116" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="760" y="110" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#64748b">↻ keep working — the cycle repeats</text>

  <!-- conflict loop under PULL -->
  <g filter="url(#shadow)">
    <rect x="420" y="300" width="580" height="74" rx="12" fill="#0b1221" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4"/>
  </g>
  <text x="440" y="329" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">conflict? (exit 2)</text>
  <text x="440" y="354" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" fill="#e2e8f0">paste prompt to agent <tspan fill="#94a3b8">→ fix files + git add →</tspan> re-run mcrepo pull</text>
  <path d="M 640 226 C 628 250, 624 272, 632 296" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <path d="M 940 300 C 952 264, 860 248, 772 230" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="588" y="262" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#f59e0b">agent prompt</text>
  <text x="962" y="272" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#f59e0b">re-run resumes</text>

  <!-- named locations chip -->
  <g filter="url(#shadow)">
    <rect x="70" y="300" width="300" height="74" rx="10" fill="#0b1221" stroke="#334155" stroke-width="1.5"/>
  </g>
  <text x="90" y="326" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">beyond origin — named locations:</text>
  <text x="90" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#22d3ee">mcrepo remote add backup</text>
  <text x="90" y="364" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#22d3ee">mcrepo pull backup · push backup</text>

  <text x="1330" y="404" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#64748b">mcrepo status — see where you are at any point</text>
</svg>
