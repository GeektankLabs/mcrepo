<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">mcrepo coordinated workflow — local branches</title>
  <desc id="desc">Four steps: branch, work and commit, rebase onto the parent, merge back. On conflict, paste the printed prompt to a coding agent, fix and stage the files, then re-run mcrepo rebase.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1221"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="1400" height="430" rx="18" fill="url(#bg)"/>

  <text x="70" y="58" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#e2e8f0">Coordinated workflow — local branches</text>
  <text x="70" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#94a3b8">one feature branch across every write repo + the meta-context — conflicts only ever happen during rebase</text>

  <!-- 1 BRANCH -->
  <g filter="url(#shadow)">
    <rect x="100" y="120" width="240" height="106" rx="14" fill="url(#card)" stroke="#6366f1" stroke-width="2"/>
  </g>
  <text x="118" y="148" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#818cf8">1 · BRANCH</text>
  <text x="118" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#e2e8f0">mcrepo branch f-x</text>
  <text x="118" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">one branch, all repos;</text>
  <text x="118" y="216" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">parent recorded per repo</text>

  <!-- 2 WORK + COMMIT -->
  <g filter="url(#shadow)">
    <rect x="420" y="120" width="240" height="106" rx="14" fill="url(#card)" stroke="#f97316" stroke-width="2"/>
  </g>
  <text x="438" y="148" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#fb923c">2 · WORK + COMMIT</text>
  <text x="438" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#e2e8f0">mcrepo commit -m ".."</text>
  <text x="438" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">coordinated checkpoints</text>
  <text x="438" y="216" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">(#N @batch) — repeat freely</text>
  <path d="M 600 120 C 600 97, 480 97, 480 120" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- 3 REBASE -->
  <g filter="url(#shadow)">
    <rect x="740" y="120" width="240" height="106" rx="14" fill="url(#card)" stroke="#06b6d4" stroke-width="2"/>
  </g>
  <text x="758" y="148" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#22d3ee">3 · REBASE</text>
  <text x="758" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#e2e8f0">mcrepo rebase</text>
  <text x="758" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">bring the parent's changes in —</text>
  <text x="758" y="216" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">conflicts are resolved HERE</text>

  <!-- 4 MERGE -->
  <g filter="url(#shadow)">
    <rect x="1060" y="120" width="240" height="106" rx="14" fill="url(#card)" stroke="#10b981" stroke-width="2"/>
  </g>
  <text x="1078" y="148" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#34d399">4 · MERGE</text>
  <text x="1078" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#e2e8f0">mcrepo merge</text>
  <text x="1078" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">fold back into each parent —</text>
  <text x="1078" y="216" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">conflict-free; offers branch cleanup</text>

  <!-- arrows -->
  <line x1="340" y1="173" x2="415" y2="173" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="660" y1="173" x2="735" y2="173" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="980" y1="173" x2="1055" y2="173" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- conflict loop under REBASE -->
  <g filter="url(#shadow)">
    <rect x="560" y="300" width="600" height="74" rx="12" fill="#0b1221" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4"/>
  </g>
  <text x="580" y="329" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">conflict? (exit 2)</text>
  <text x="580" y="354" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" fill="#e2e8f0">paste prompt to agent <tspan fill="#94a3b8">→ fix files + git add →</tspan> re-run mcrepo rebase</text>
  <path d="M 800 226 C 788 250, 784 272, 792 296" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <path d="M 1090 300 C 1102 264, 1000 248, 902 230" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="748" y="262" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#f59e0b">agent prompt</text>
  <text x="1112" y="272" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#f59e0b">re-run resumes</text>

  <text x="70" y="404" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#64748b">mcrepo status — see where you are</text>
  <text x="1330" y="404" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#64748b">publish afterwards via the remote workflow — mcrepo push</text>
</svg>
