<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">mcrepo coordinated git workflow</title>
  <desc id="desc">Five steps: branch, work and commit, rebase, merge, push. Conflicts are resolved during the rebase via resolve and continue; pull keeps the workspace current while working.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1221"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="1400" height="430" rx="18" fill="url(#bg)"/>

  <!-- heading -->
  <text x="70" y="58" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#e2e8f0">The coordinated workflow</text>
  <text x="70" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#94a3b8">one feature branch across every write repo + the meta-context — conflicts only ever happen during rebase</text>

  <!-- pull chip (side input into WORK) -->
  <g filter="url(#shadow)">
    <rect x="368" y="330" width="200" height="44" rx="10" fill="#0b1221" stroke="#334155" stroke-width="1.5"/>
  </g>
  <text x="468" y="349" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">stay current anytime</text>
  <text x="468" y="366" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#22d3ee">mcrepo pull</text>
  <line x1="440" y1="330" x2="416" y2="228" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- 5 main nodes -->
  <!-- 1 BRANCH -->
  <g filter="url(#shadow)">
    <rect x="70" y="120" width="212" height="106" rx="14" fill="url(#card)" stroke="#6366f1" stroke-width="2"/>
  </g>
  <text x="86" y="148" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#818cf8">1 · BRANCH</text>
  <text x="86" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#e2e8f0">mcrepo branch f-x</text>
  <text x="86" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">one branch, all repos;</text>
  <text x="86" y="216" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">parent recorded per repo</text>

  <!-- 2 WORK + COMMIT -->
  <g filter="url(#shadow)">
    <rect x="335" y="120" width="212" height="106" rx="14" fill="url(#card)" stroke="#f97316" stroke-width="2"/>
  </g>
  <text x="351" y="148" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#fb923c">2 · WORK + COMMIT</text>
  <text x="351" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#e2e8f0">mcrepo commit -m ".."</text>
  <text x="351" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">coordinated checkpoints</text>
  <text x="351" y="216" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">(#N @batch) — repeat freely</text>
  <!-- self-loop for repeat -->
  <path d="M 490 120 C 490 97, 392 97, 392 120" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- 3 REBASE -->
  <g filter="url(#shadow)">
    <rect x="600" y="120" width="212" height="106" rx="14" fill="url(#card)" stroke="#06b6d4" stroke-width="2"/>
  </g>
  <text x="616" y="148" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#22d3ee">3 · REBASE</text>
  <text x="616" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#e2e8f0">mcrepo rebase</text>
  <text x="616" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">rebase onto the parent —</text>
  <text x="616" y="216" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">conflicts are resolved HERE</text>

  <!-- 4 MERGE -->
  <g filter="url(#shadow)">
    <rect x="865" y="120" width="212" height="106" rx="14" fill="url(#card)" stroke="#10b981" stroke-width="2"/>
  </g>
  <text x="881" y="148" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#34d399">4 · MERGE</text>
  <text x="881" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#e2e8f0">mcrepo merge</text>
  <text x="881" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">squash back into each parent</text>
  <text x="881" y="216" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">— conflict-free after rebase</text>

  <!-- 5 PUSH -->
  <g filter="url(#shadow)">
    <rect x="1130" y="120" width="200" height="106" rx="14" fill="url(#card)" stroke="#a78bfa" stroke-width="2"/>
  </g>
  <text x="1146" y="148" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#c4b5fd">5 · PUSH</text>
  <text x="1146" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#e2e8f0">mcrepo push</text>
  <text x="1146" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">publish to origin — safe</text>
  <text x="1146" y="216" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">force-with-lease when rebased</text>

  <!-- arrows between nodes -->
  <line x1="282" y1="173" x2="330" y2="173" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="547" y1="173" x2="595" y2="173" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="812" y1="173" x2="860" y2="173" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1077" y1="173" x2="1125" y2="173" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- conflict loop under REBASE -->
  <g filter="url(#shadow)">
    <rect x="620" y="300" width="460" height="74" rx="12" fill="#0b1221" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4"/>
  </g>
  <text x="640" y="329" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">conflict?</text>
  <text x="640" y="354" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" fill="#e2e8f0">mcrepo resolve <tspan fill="#94a3b8">→ paste prompt to agent → fix →</tspan> mcrepo continue</text>
  <path d="M 660 226 C 648 250, 644 272, 652 296" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <path d="M 1012 300 C 1024 264, 900 250, 792 230" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="608" y="262" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#f59e0b">exit 2</text>
  <text x="1040" y="272" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#f59e0b">back to rebase</text>

  <!-- status footer -->
  <text x="1330" y="404" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#64748b">mcrepo status — see where you are at any point</text>
</svg>
