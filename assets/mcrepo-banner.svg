<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540" role="img" aria-labelledby="title desc">
  <title id="title">mcrepo — Multi-Context Repository</title>
  <desc id="desc">Overview in three panels: a workspace holding many independent git repositories with write, read, and sleep modes plus shared folders; one mcrepo command fanning out across every repo (branch, commit, rebase, merge, pull, push, pr, status); and the AI-agent-first side where agents get all repos as one context and conflicts are resolved by pasting a printed prompt to a coding agent and re-running the command.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1221"/>
    </linearGradient>
    <linearGradient id="chipWrite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="chipRead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="chipSleep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1400" height="540" rx="18" fill="url(#bg)"/>
  <circle cx="1300" cy="30" r="140" fill="#22d3ee" opacity="0.06"/>
  <circle cx="180" cy="560" r="200" fill="#f97316" opacity="0.08"/>

  <!-- header -->
  <text x="70" y="58" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#e2e8f0">mcrepo — Multi-Context Repository</text>
  <text x="70" y="86" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#94a3b8">many independent git repos in one workspace · one shell script · coordinated for AI coding agents</text>

  <!-- mode chips (header right) -->
  <rect x="1006" y="38" width="98" height="30" rx="15" fill="url(#chipWrite)"/>
  <text x="1055" y="58" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif">✏️ write</text>
  <rect x="1116" y="38" width="92" height="30" rx="15" fill="url(#chipRead)"/>
  <text x="1162" y="58" text-anchor="middle" fill="#06202a" font-size="13" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif">👀 read</text>
  <rect x="1220" y="38" width="96" height="30" rx="15" fill="url(#chipSleep)"/>
  <text x="1268" y="58" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif">💤 sleep</text>

  <!-- CARD A: the workspace -->
  <g filter="url(#shadow)">
    <rect x="70" y="118" width="420" height="340" rx="14" fill="url(#card)" stroke="#6366f1" stroke-width="2"/>
  </g>
  <rect x="71.5" y="119.5" width="417" height="36" rx="13" fill="#0b1328"/>
  <rect x="71.5" y="140" width="417" height="16" fill="#0b1328"/>
  <circle cx="96" cy="138" r="5" fill="#ef4444"/>
  <circle cx="114" cy="138" r="5" fill="#f59e0b"/>
  <circle cx="132" cy="138" r="5" fill="#22c55e"/>
  <text x="152" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#94a3b8">my-workspace/ · meta-context repo</text>

  <text x="96" y="180" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#818cf8">ONE WORKSPACE — MANY REPOS</text>

  <text x="96" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#e2e8f0">mcrepo.sh</text>
  <text x="272" y="208" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#64748b">the whole tool — one script</text>
  <text x="96" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#e2e8f0">mcrepo.yaml</text>
  <text x="272" y="232" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#64748b">manifest: repos · modes · branch</text>

  <text x="96" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#e2e8f0">✏️ api/</text>
  <text x="272" y="260" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#94a3b8">write · active changes</text>
  <text x="96" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#e2e8f0">✏️ frontend/</text>
  <text x="272" y="284" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#94a3b8">write · active changes</text>
  <text x="96" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#e2e8f0">👀 docs-site/</text>
  <text x="272" y="308" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#94a3b8">read · context only</text>
  <text x="96" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#e2e8f0">💤 legacy/</text>
  <text x="272" y="332" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#94a3b8">sleep · clone removed</text>
  <text x="96" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#e2e8f0">🌱 new-idea/</text>
  <text x="272" y="356" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#94a3b8">incubator · mcrepo new</text>

  <text x="96" y="386" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#94a3b8">🧩 +-contracts  🧾 +-docs  🧪 +-tests</text>
  <text x="96" y="410" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#94a3b8">🧠 +-skills</text>
  <text x="272" y="410" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#64748b">shared cross-repo folders</text>

  <text x="96" y="440" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#64748b">every repo keeps its own .git — no monorepo migration</text>

  <!-- CARD B: one command, every repo -->
  <g filter="url(#shadow)">
    <rect x="530" y="118" width="390" height="340" rx="14" fill="url(#card)" stroke="#06b6d4" stroke-width="2"/>
  </g>
  <text x="552" y="150" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#22d3ee">ONE COMMAND — EVERY REPO</text>
  <text x="552" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#e2e8f0">$ mcrepo &lt;command&gt;</text>

  <path d="M 610 192 C 608 198, 605 204, 603 210" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 618 192 C 654 200, 690 205, 719 210" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 624 190 C 728 196, 800 203, 842 210" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="552" y="214" width="100" height="36" rx="8" fill="#0b1328" stroke="#334155"/>
  <text x="602" y="237" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#e2e8f0">✏️ api</text>
  <rect x="668" y="214" width="110" height="36" rx="8" fill="#0b1328" stroke="#334155"/>
  <text x="723" y="237" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#e2e8f0">✏️ frontend</text>
  <rect x="794" y="214" width="104" height="36" rx="8" fill="#0b1328" stroke="#334155"/>
  <text x="846" y="237" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#e2e8f0">🗂 meta</text>
  <text x="552" y="274" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#94a3b8">…every write repo + the meta-context, in one run</text>

  <text x="552" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#22d3ee">branch</text>
  <text x="678" y="306" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#94a3b8">one feature branch across repos</text>
  <text x="552" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#22d3ee">commit</text>
  <text x="678" y="332" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#94a3b8">one checkpoint: #N @batch</text>
  <text x="552" y="358" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#22d3ee">rebase · merge</text>
  <text x="678" y="358" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#94a3b8">conflicts only in rebase</text>
  <text x="552" y="384" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#22d3ee">pull · push</text>
  <text x="678" y="384" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#94a3b8">origin + named locations</text>
  <text x="552" y="410" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#22d3ee">pr</text>
  <text x="678" y="410" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#94a3b8">coordinated, cross-linked PRs</text>
  <text x="552" y="436" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#22d3ee">status</text>
  <text x="678" y="436" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#94a3b8">every repo at a glance</text>

  <!-- CARD C: AI-agent-first -->
  <g filter="url(#shadow)">
    <rect x="970" y="118" width="360" height="340" rx="14" fill="url(#card)" stroke="#10b981" stroke-width="2"/>
  </g>
  <text x="992" y="150" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#34d399">AI-AGENT-FIRST</text>
  <text x="992" y="180" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#e2e8f0">agents see the whole workspace —</text>
  <text x="992" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#e2e8f0">every repo becomes shared context</text>

  <rect x="992" y="222" width="104" height="30" rx="15" fill="#0b1328" stroke="#334155"/>
  <circle cx="1010" cy="237" r="4" fill="#22d3ee"/>
  <text x="1022" y="241" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#cbd5e1">OpenCode</text>
  <rect x="1106" y="222" width="114" height="30" rx="15" fill="#0b1328" stroke="#334155"/>
  <circle cx="1124" cy="237" r="4" fill="#f59e0b"/>
  <text x="1136" y="241" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#cbd5e1">Claude Code</text>
  <rect x="1230" y="222" width="76" height="30" rx="15" fill="#0b1328" stroke="#334155"/>
  <circle cx="1248" cy="237" r="4" fill="#60a5fa"/>
  <text x="1260" y="241" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#cbd5e1">Codex</text>

  <rect x="992" y="278" width="316" height="142" rx="10" fill="#0b1221" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1010" y="306" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#fbbf24">on conflict — the command is the loop</text>
  <text x="1010" y="332" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#e2e8f0">1 · mcrepo prints a paste-ready agent prompt</text>
  <text x="1010" y="354" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#e2e8f0">2 · the agent fixes files + git add</text>
  <text x="1010" y="376" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#e2e8f0">3 · re-run the same command — it resumes</text>
  <text x="1010" y="402" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#94a3b8">strictly local — works without your git logins</text>

  <text x="992" y="444" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#64748b">generated AGENTS.md + skills brief every agent</text>

  <!-- arrows between cards -->
  <line x1="496" y1="288" x2="524" y2="288" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="926" y1="288" x2="964" y2="288" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- footer -->
  <text x="70" y="502" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#64748b">not a monorepo — repos stay independent, split by ownership &amp; domain</text>
  <text x="1330" y="502" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#64748b">./mcrepo.sh init — one script is the whole install</text>
</svg>
